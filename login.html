<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · BusinessSense</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><main class="login" id="main"><form class="panel" action="index.html">
<div><h1>BusinessSense</h1><p class="muted">Log in to your shop.</p></div>
<div><label for="e">Email</label><input id="e" type="email" autocomplete="email" required></div>
<div><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
<button class="btn" type="submit">Log in</button>
<p class="hint">There is no sign-up. Ask the BusinessSense team if you need a login.</p></form></main></body></html>

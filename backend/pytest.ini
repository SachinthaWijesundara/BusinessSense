# pytest settings: run from backend/ with `python -m pytest`.
# pythonpath lets tests import main, config, api, agentic, services and database directly.
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    postgres: runs against the test Postgres + pgvector (tests/pglite, or TEST_DATABASE_URL)
    live: calls the real OpenAI API (needs OPENAI_API_KEY and RUN_LIVE_TESTS=1)
